[project]
name = "ska-ser-namespace-manager"
version = "0.3.2"
description = "SKA Kubernetes Namespace Manager"
authors = [{ name = "System Team" }]
license = "BSD-3-Clause"
requires-python = ">=3.10,<4.0"
dependencies = [
    "uvicorn>=0.46.0,<0.47.0",
    "starlette>=1.0.0,<2.0.0",
    "fastapi>=0.136.1,<0.137.0",
    "ska-cicd-services-api==1.2.0",
    "wrapt>=2.1.2,<3.0.0",
    "filelock>=3.29.0,<4.0.0",
    "kubernetes>=35.0.0,<36.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "pytz>=2026.1,<2027.0",
    "slack-bolt>=1.28.0,<2.0.0",
    "humanfriendly>=10.0,<11.0",
    "prometheus-client>=0.25.0,<0.26.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0,<26.0.0",
    "isort>=7.0.0,<8.0.0",
    "flake8>=7.3.0,<8.0.0",
    "pylint>=4.0.2,<5.0.0",
    "pylint-junit>=0.3.5,<0.4.0",
    "pytest>=9.0.1,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.15.18,<0.16.0",
]
docs = [
    "sphinx>=7.4.5,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "recommonmark>=0.7.1,<0.8.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[[tool.uv.index]]
name = "PyPI-public"
url = "https://pypi.org/simple"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# Submodule (.make) and the generated Sphinx docs tree (conf.py + committed
# _build output) are not part of the project's lint scope.
extend-exclude = [".make", "docs"]

[tool.ruff.lint]
# E,F,W  -> flake8 ; I -> isort ; PL -> pylint subset
select = ["E", "F", "W", "I", "PL"]
# Mirror the historical pylint config (.pylintrc disabled the C/R
# categories wholesale and several design checks), so only keep the
# pylint error/warning subset that was actually enforced before.
ignore = [
    "PLC",     # convention   (pylint: disable=C)
    "PLR",     # refactor     (pylint: disable=R, incl. magic-value/too-many-*)
    "PLW2901", # redefined-loop-name (not enforced previously)
]

[tool.ruff.lint.isort]
# Match the previous isort "black" profile (line_length handled above).
force-sort-within-sections = false

[build-system]
requires = ["uv_build>=0.10.10,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ska_ser_namespace_manager"
module-root = "src"
