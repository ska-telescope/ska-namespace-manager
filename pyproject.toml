[tool.poetry]
name = "ska-ser-namespace-manager"
version = "0.2.0"
description = "SKA Kubernetes Namespace Manager"
authors = ["System Team"]
license = "BSD-3-Clause"
packages = [
    { include = "ska_ser_namespace_manager", from = "src" }
]

[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[[tool.poetry.source]]
name = "PyPI-public"
url = 'https://pypi.org/simple'

[tool.poetry.dependencies]
python = "^3.10"
uvicorn = "^0.46.0"
starlette = "^1.0.0"
fastapi = "^0.136.1"
ska-cicd-services-api = "^1.1.1"
wrapt = "^2.1.2"
filelock = "^3.29.0"
kubernetes = "^35.0.0"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
pytz = "^2026.1"
slack-bolt = "^1.28.0"
humanfriendly = "^10.0"
prometheus-client = "^0.25.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
isort = "^5.13.2"
flake8 = "^7.1.0"
pylint = "^3.2.5"
pylint-junit = "^0.3.4"
pytest = ">=8.0.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.4.5"
sphinx-rtd-theme = "^2.0.0"
recommonmark = "^0.7.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
