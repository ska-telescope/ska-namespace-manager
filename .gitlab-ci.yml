variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ENVIRONMENT: ci

default:
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY

stages:
  #- lint
  #- join-reports
  - build
  - test
  - scan
  - pages
  - publish

k8s-test-runner:
  tags:
    - ska-staging-k8s
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://gitlab.com
  variables:
    K8S_EXTRA_VALUES: "${NS_MANAGER_SECRET_CONFIG_VALUES}"
    NSTEST_NAMESPACE_PREFIX: "nscicd-${CI_COMMIT_SHORT_SHA}-"
  secrets:
    NS_MANAGER_SECRET_CONFIG_VALUES:
      vault: staging/ci/ska-ser-namespace-manager/values.yml@stfc-techops
      file: true
      token: $VAULT_ID_TOKEN
    NSTEST_AUTHOR_EMAIL:
      vault: staging/ci/ska-ser-namespace-manager/NSTEST_AUTHOR_EMAIL@stfc-techops
      token: $VAULT_ID_TOKEN
    NSTEST_AUTHOR_GITLAB_HANDLE:
      vault: staging/ci/ska-ser-namespace-manager/NSTEST_AUTHOR_GITLAB_HANDLE@stfc-techops
      token: $VAULT_ID_TOKEN
    NSTEST_AUTHOR_ID:
      vault: staging/ci/ska-ser-namespace-manager/NSTEST_AUTHOR_ID@stfc-techops
      token: $VAULT_ID_TOKEN
    NSTEST_EXPECTED_SLACK_ID:
      vault: staging/ci/ska-ser-namespace-manager/NSTEST_EXPECTED_SLACK_ID@stfc-techops
      token: $VAULT_ID_TOKEN
    NSTEST_EXPECTED_TEAM:
      vault: staging/ci/ska-ser-namespace-manager/NSTEST_EXPECTED_TEAM@stfc-techops
      token: $VAULT_ID_TOKEN

include:
  #- project: "ska-telescope/templates-repository"
  #  file: "gitlab-ci/includes/python.gitlab-ci.yml"

  #- project: "ska-telescope/templates-repository"
  #  file: "gitlab-ci/includes/helm-chart.gitlab-ci.yml"

  #- project: "ska-telescope/templates-repository"
  #  file: "gitlab-ci/includes/oci-image.gitlab-ci.yml"

  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/helm-chart-build.gitlab-ci.yml"

  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/oci-image-build.gitlab-ci.yml"

  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/k8s-test-runner.gitlab-ci.yml"

  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/release.gitlab-ci.yml"

  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/docs.gitlab-ci.yml"

  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
